name: Build and test APK

on:
  push:
    branches: [athaan-app]
    paths-ignore: ["dist/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: athaan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests, then debug and release APKs
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleRelease

      - name: Keep unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-tests
          path: app/build/reports/tests/

      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/debug/app-debug.apk

  ui-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apks
          path: apks

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the app on an Android 14 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: python3 ci/uitest.py apks/debug/app-debug.apk test-results

      - name: Keep test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test
          path: test-results

  publish:
    needs: [build, ui-test]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apks
          path: apks
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ui-test
          path: dist/test
      - name: Publish APK and test results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          cp apks/release/app-release.apk dist/Athaan.apk
          echo "ui-test: ${{ needs.ui-test.result }}" > dist/status.txt
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" dist/Athaan.apk --target "${{ github.sha }}" --title "Athaan $TAG" --notes "APK built from ${{ github.sha }} (UI test: ${{ needs.ui-test.result }})" || true
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git rm -rq --cached dist 2>/dev/null || true
          git add -f dist
          git commit -m "Build ${{ github.run_number }}: APK and test results [skip ci]"
          git push
